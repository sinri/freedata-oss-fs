name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.86.0"
          targets: x86_64-unknown-linux-musl
      - name: Verify release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package Linux binary
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="ossfs-ro-${version}-x86_64-unknown-linux-musl"
          mkdir -p "dist/${archive}"
          install -m 0755 target/x86_64-unknown-linux-musl/release/ossfs-ro "dist/${archive}/"
          install -m 0644 README.md LICENSE config.example.yaml "dist/${archive}/"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-linux-x86_64
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "ossfs-ro ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              dist/*.tar.gz dist/SHA256SUMS
          fi
